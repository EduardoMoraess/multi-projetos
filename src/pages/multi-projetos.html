<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Projetos</title>
    <!--css3-->
    <link rel="stylesheet" href="/src/css/multi-projetos.css">
</head>

<body>
    <section class="calc-porcentagem">
        <h2>Calculadora de %</h2>
        <div class="container-porcentagem">
            <input type="number" placeholder="valor" required id="valor" class="input">
            <input type="number" placeholder="porcentagem" id="porcentagem" class="input">
            <button id="calc">Calcular</button>
            <div id="resultado"></div>
        </div>
    </section>

    <section class="calc-imc">
        <div class="ferramenta-card">
            <h2>⚖️ Calculadora de IMC</h2>

            <label for="peso">Seu Peso (kg):</label>
            <input type="number" id="peso" placeholder="Ex: 75">

            <label for="altura">Sua Altura (m):</label>
            <input type="number" id="altura" placeholder="Ex: 1.75">

            <button id="btn-imc">Verificar Condição</button>

            <p id="resultado-imc">O resultado aparecerá aqui.</p>
        </div>
    </section>

    <section class="qrcode">
        <div class="container">
            <h1>Gerador de QR Code</h1>
            <p>Insira um link ou texto abaixo:</p>

            <input type="text" id="text" placeholder="Ex: https://google.com" />
            <button id="generate-btn">Gerar QR Code</button>

            <div id="qrcode-container">
                <div id="qrcode"></div>
            </div>
        </div>
    </section>

    <section class="conversor-temp">
        <div class="calc-temp">
            <h2>Conversor de Temperatura</h2>

            <div class="input-group">
                <label>Celsius (°C)</label>
                <input type="number" id="celsius" placeholder="Ex: 25">
            </div>

            <div class="input-group">
                <label>Fahrenheit (°F)</label>
                <input type="number" id="fahrenheit" placeholder="Ex: 77">
            </div>

            <div class="input-group">
                <label>Kelvin (K)</label>
                <input type="number" id="kelvin" placeholder="Ex: 298.15">
            </div>

            <div id="resultado-final" class="display-box">
                Insira um valor para ver a comparação
            </div>
        </div>
    </section>

    <!--javascript-->
    <script src="/src/js/calculadoras.js"></script>
    <script src="/src/js/geradorQR.js"></script>
    <script src="/src/js/converterTemp.js"></script>
    <!--Biblioteca de QRCODE-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</body>

</html>
